name: Automatyczny scraper lokalny

on:
  schedule:
    - cron: '0 5,11,17 * * *'   # 5:00, 11:00 i 17:00 UTC, czyli ok. 7:00, 13:00 i 19:00 w Polsce (godziny do ustalenia, patrz SLOTY_GODZINY w scraper.py)
  workflow_dispatch:       # ręczne uruchomienie przyciskiem "Run workflow"
  push:
    paths:
      - 'data/manual.json'  # po edycji wpisów ręcznych strona przebudowuje się od razu
      - 'render.py'         # zmiana wyglądu też przebudowuje stronę (tryb --render-only, bez zużycia limitu AI)
      - 'redakcja.py'
      - 'template.html'
      - 'grafiki.py'
      - 'klasyfikacja.py'
      - 'scraper.py'
      - 'sources.json'

permissions:
  contents: write
  models: read            # darmowe GitHub Models do notek pod tytułami

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m unittest test_scraper -v

      - name: Uruchomienie bota
        env:
          PYTHONUNBUFFERED: "1"                                # log widoczny na żywo, nie dopiero na końcu
          BOT_CONTACT: ${{ vars.BOT_CONTACT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcjonalny: płatna alternatywa, domyślnie używamy darmowych GitHub Models
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}              # opcjonalny: inny model niż domyślny
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scraper.py --render-only
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python scraper.py --slot auto        # o stałej porze pobiera tylko źródła przewidziane na tę porę
          else
            python scraper.py                    # ręczne uruchomienie pobiera wszystkie źródła na dziś
          fi

      - name: Zapis zmian na stronie
        run: |
          git config user.name "Grodzisk lokalnie bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html archiwum.html data/
          git diff --cached --quiet || git commit -m "Automatyczna aktualizacja ($(date -u +%F))"
          git push
