name: Zdjęcia z Wikimedia Commons

on:
  workflow_dispatch:       # tylko ręcznie: przycisk "Run workflow"
    inputs:
      tryb:
        description: 'pobierz = pobranie zdjęć z data/zdjecia_wybor.txt i przebudowa strony; wsie = automatyczny wybór po 3 zdjęcia dla każdej miejscowości gminy, pobranie i przebudowa; tematy = arkusz tylko ze zdjęciami ogólnymi do tematów; szukaj = arkusz z wyników wyszukiwania Commons o Grodzisku; kandydaci = pełny arkusz (miejsca i tematy)'
        type: choice
        options:
          - pobierz
          - wsie
          - tematy
          - szukaj
          - kandydaci
        default: pobierz
      fraza:
        description: 'tylko dla trybu szukaj: własne frazy oddzielone średnikiem, np. Książenice; Książenice szkoła (puste = domyślny zestaw o Grodzisku)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scraper           # ta sama grupa co bot wiadomości, żeby oba nie zapisywały naraz
  cancel-in-progress: false

jobs:
  zdjecia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kandydaci na zdjęcia (arkusz do wyboru)
        if: ${{ inputs.tryb == 'kandydaci' || inputs.tryb == 'tematy' || inputs.tryb == 'szukaj' || inputs.tryb == 'wsie' }}
        env:
          PYTHONUNBUFFERED: "1"
          BOT_CONTACT: ${{ vars.BOT_CONTACT }}
          FRAZA: ${{ inputs.fraza }}
        run: python zdjecia_commons.py ${{ inputs.tryb == 'tematy' && '--tematy' || inputs.tryb == 'szukaj' && '--szukaj' || inputs.tryb == 'wsie' && '--wsie' || '' }}

      - name: Pobranie wybranych zdjęć i przebudowa strony
        if: ${{ inputs.tryb == 'pobierz' || inputs.tryb == 'wsie' }}
        env:
          PYTHONUNBUFFERED: "1"
          BOT_CONTACT: ${{ vars.BOT_CONTACT }}
        run: |
          python zdjecia_pobierz.py
          python scraper.py --render-only

      - name: Zapis wyników
        run: |
          git config user.name "Grodzisk lokalnie bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if [ -d zdjecia ]; then git add zdjecia; fi
          git add index.html archiwum.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Zdjęcia z Commons ($(date -u +%F))"
          git push
