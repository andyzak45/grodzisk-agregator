name: Automatyczny scraper lokalny

on:
  schedule:
    - cron: '0 5 * * *'   # 5:00 UTC, czyli 6:00 lub 7:00 w Polsce zależnie od pory roku
  workflow_dispatch:       # ręczne uruchomienie przyciskiem "Run workflow"
  push:
    paths:
      - 'data/manual.json'  # po edycji wpisów ręcznych strona przebudowuje się od razu

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m unittest test_scraper -v

      - name: Uruchomienie bota
        env:
          BOT_CONTACT: ${{ vars.BOT_CONTACT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcjonalny: bez niego nie powstają notki pod tytułami
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}              # opcjonalny: domyślnie claude-haiku-5-5
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scraper.py --render-only
          else
            python scraper.py
          fi

      - name: Zapis zmian na stronie
        run: |
          git config user.name "Grodzisk lokalnie bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet || git commit -m "Automatyczna aktualizacja ($(date -u +%F))"
          git push
