<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grodzisk lokalnie</title>
    <style>
        :root { --bg-color: #ffffff; --card-bg: #ffffff; --text-main: #111827; --text-muted: #5b6472; --accent: #2563eb; --rule: #e5e7eb; --border-radius: 0;
                --c-ost: #dc2626; --c-zdr: #dc2626; --c-wyd: #d97706; --c-inw: #2563eb; --c-spo: #4f46e5; --c-inne: #475569;
                --cond: "Oswald", "Roboto Condensed", "Arial Narrow", "Liberation Sans Narrow", "Helvetica Neue", Arial, sans-serif; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.5; }
        header { background-color: var(--card-bg); border-bottom: 3px solid var(--text-main); padding: 0.9rem 1.5rem 0; position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
        h1 { margin: 0; font-family: var(--cond); font-size: 2rem; font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1.1; }
        h1 span { color: var(--accent); }
        .dzien { font-family: var(--cond); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        .updated { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .cat-nav { max-width: 1300px; margin: 0.6rem auto 0; display: flex; gap: 0.25rem 1.4rem; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .cat-link { font-family: var(--cond); font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.03em; text-decoration: none; color: var(--text-main); padding: 0.45rem 0 0.4rem; border-bottom: 4px solid var(--c-inne); }
        .cat-link.c-ost { border-color: var(--c-ost); } .cat-link.c-zdr { border-color: var(--c-zdr); } .cat-link.c-wyd { border-color: var(--c-wyd); }
        .cat-link.c-inw { border-color: var(--c-inw); } .cat-link.c-spo { border-color: var(--c-spo); } .cat-link.c-inne { border-color: var(--c-inne); }
        .cat-link.zero { opacity: 0.4; }
        .cat-link.active { background: var(--text-main); color: #fff; padding-left: 0.6rem; padding-right: 0.6rem; } .cat-link.active .cat-count { color: #cbd5e1; }
        .cat-count { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; margin-left: 0.15rem; }
        main { max-width: 1300px; margin: 1.25rem auto 2rem; padding: 0 1.5rem; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 0 0 1rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        select { font: inherit; font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 99px; border: 1px solid #cbd5e1; background: #fff; color: var(--text-main); cursor: pointer; }
        .ilu { flex: 0 0 auto; aspect-ratio: 16 / 6; margin: 0 0 0.7rem; overflow: hidden; background: var(--t); color: var(--c); }
        .ilu svg, .ilu img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .ilu.foto { position: relative; } .ilu.foto img { position: absolute; inset: 0; }
        .podpis { flex: 0 0 auto; margin: 0 0 0.7rem; font-size: 0.62rem; line-height: 1.3; color: var(--text-muted); } .podpis a { color: inherit; }
        .k-inne { --t: #e2e8f0; --c: #475569; } .k-ost, .k-zdr { --t: #fee2e2; --c: #b91c1c; } .k-wyd { --t: #fef3c7; --c: #b45309; }
        .k-inw { --t: #dbeafe; --c: #1d4ed8; } .k-spo { --t: #e0e7ff; --c: #4338ca; }
        .hero.z-foto::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to top, rgba(0,0,0,0.82) 20%, rgba(0,0,0,0.15) 100%); }
        .hero > .hero-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .hero > .hero-body { position: relative; z-index: 2; }
        .hero > .hero-fot { position: absolute; top: 0.5rem; right: 0.6rem; z-index: 2; max-width: 80%; text-align: right; font-size: 0.62rem; line-height: 1.3; color: rgba(255,255,255,0.85); text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
        .hero > .hero-fot a { color: inherit; }
        .terminy { border-top: 3px solid var(--text-main); background: #f8fafc; padding: 0.8rem 1rem 0.9rem; margin-bottom: 1.75rem; }
        .terminy h2 { font-family: var(--cond); text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.05rem; margin: 0 0 0.55rem; }
        .terminy .grupy { columns: 2 26rem; column-gap: 2.5rem; }
        .td { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); column-gap: 0.6rem; break-inside: avoid; border-top: 1px solid var(--rule); padding: 0.45rem 0 0.4rem; }
        .terminy .grupy .td:first-child { border-top: 0; padding-top: 0.1rem; }
        .td h3 { font-family: var(--cond); font-size: 0.95rem; font-weight: 700; color: #e11d48; margin: 0; line-height: 1.35; text-transform: capitalize; }
        .td ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
        .termin { font-size: 0.95rem; line-height: 1.35; }
        .termin .g { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-right: 0.15rem; }
        .termin .mj { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; margin-left: 0.3rem; }
        .termin a { color: var(--text-main); font-weight: 600; text-decoration: none; }
        .termin a:hover { text-decoration: underline; }
        @media (max-width: 600px) { .td { grid-template-columns: 1fr; row-gap: 0.15rem; } }
        .ticker { display: flex; align-items: stretch; gap: 1rem; background: #f3f4f6; margin-bottom: 1.25rem; overflow: hidden; }
        .ticker-label { background: #bbf7a0; color: #111; font-family: var(--cond); font-weight: 800; text-transform: uppercase; padding: 0.7rem 1rem; display: flex; align-items: center; flex-shrink: 0; letter-spacing: 0.04em; }
        .ticker-list { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1.4rem; flex: 1; min-width: 0; padding: 0.6rem 1.25rem 0.6rem 0; }
        .tick { font-family: var(--cond); font-weight: 600; font-size: 0.98rem; line-height: 1.25; color: var(--text-main); text-decoration: none; min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .tick time { color: #e11d48; font-weight: 700; }
        .tick:hover { text-decoration: underline; }
        @media (max-width: 900px) { .ticker { flex-direction: column; gap: 0; } .ticker-label { padding: 0.45rem 1rem; } .ticker-list { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0.6rem 1rem; } .tick { -webkit-line-clamp: 2; } }
        @media (max-width: 560px) { .ticker-list { grid-template-columns: 1fr; gap: 0.7rem; } }
        .front { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        .hero { position: relative; min-height: 360px; display: flex; flex-direction: column; justify-content: flex-end; padding: 1.6rem; color: #fff; overflow: hidden; }
        .hero > .hero-ilu { position: absolute; top: 0; left: 0; width: 100%; height: 62%; color: #fff; --t: transparent; opacity: 0.2; }
        .hero h2 { font-family: var(--cond); font-weight: 800; font-size: 2.3rem; line-height: 1.1; margin: 0.5rem 0 0.7rem; color: #fff; }
        .hero .opis { color: rgba(255,255,255,0.92); font-size: 1rem; }
        .hero .meta-bar, .hero .meta-src, .hero .when { color: rgba(255,255,255,0.9); }
        .hero .badge { background: rgba(255,255,255,0.2); color: #fff; }
        .hero .read-more { color: #fff; }
        .front-side { display: flex; flex-direction: column; gap: 1.5rem; }
        .side { border-top: 4px solid var(--c-inne); padding-top: 0.6rem; flex: 1; }
        .side[data-kind="ost"] { border-color: var(--c-ost); } .side[data-kind="wyd"] { border-color: var(--c-wyd); }
        .side[data-kind="inw"] { border-color: var(--c-inw); } .side[data-kind="spo"] { border-color: var(--c-spo); }
        .side h3 { font-size: 1.45rem; }
        .kat { margin-top: 2.2rem; scroll-margin-top: 110px; }
        .kat-head { display: flex; align-items: center; gap: 0.6rem; border-bottom: 4px solid var(--c-inne); padding-bottom: 0.35rem; margin-bottom: 1rem; }
        .kat.c-ost .kat-head { border-color: var(--c-ost); } .kat.c-zdr .kat-head { border-color: var(--c-zdr); } .kat.c-wyd .kat-head { border-color: var(--c-wyd); }
        .kat.c-inw .kat-head { border-color: var(--c-inw); } .kat.c-spo .kat-head { border-color: var(--c-spo); }
        .kat-head .ico { width: 26px; height: 26px; color: var(--text-main); margin: 0; }
        .kat-head h2 { margin: 0; font-family: var(--cond); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; flex: 1; letter-spacing: 0.02em; }
        .kat-count { font-family: var(--cond); font-weight: 800; font-size: 1.2rem; color: var(--text-muted); }
        .kat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .kat-empty { color: var(--text-muted); margin: 0.25rem 0 0; }
        .more { display: block; margin: 1.2rem auto 0; font: inherit; font-weight: 700; font-size: 0.85rem; color: var(--text-main); background: #fff; border: 1px solid #cbd5e1; border-radius: 99px; padding: 0.45rem 1.4rem; cursor: pointer; }
        .portal-card { background: transparent; display: flex; flex-direction: column; }
        .kat-grid .portal-card { border-top: 1px solid var(--rule); padding-top: 0.6rem; }
        .card-body { display: flex; flex-direction: column; flex-grow: 1; }
        .meta-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem 0.65rem; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .meta-src { font-size: 0.75rem; color: var(--text-muted); margin: 0 0 0.45rem; }
        .meta-src .sep { margin: 0 0.1rem; }
        .tag { font-family: var(--cond); font-weight: 800; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; padding: 0.1rem 0.45rem; background: #e2e8f0; color: #111; }
        .t-ost, .t-zdr { background: #fecaca; } .t-wyd { background: #fde68a; } .t-inw { background: #bfdbfe; } .t-spo { background: #c7d2fe; }
        .badge { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        h3 { margin: 0 0 0.5rem 0; font-family: var(--cond); font-size: 1.25rem; font-weight: 700; line-height: 1.2; color: #0f172a; }
        .opis { color: #374151; font-size: 0.92rem; margin: 0 0 0.7rem 0; }
        .kat-grid .opis { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        @media (max-width: 600px) { .kat-grid .opis { display: block; overflow: visible; } }
        .when { color: #111827; font-size: 0.88rem; margin: 0 0 0.8rem 0; font-weight: 700; }
        .card-foot { margin-top: auto; padding-top: 0.2rem; }
        .card-foot .when { margin: 0 0 0.35rem; }
        .when.opub { font-weight: 400; }
        .read-more { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.82rem; margin-top: auto; display: inline-flex; align-items: center; }
        .ico { width: 34px; height: 34px; color: rgba(255,255,255,0.92); flex-shrink: 0; }
        .bg-kultura { background: linear-gradient(135deg, #7c2d12 0%, #f59e0b 100%); }
        .bg-alert { background: linear-gradient(135deg, #7f1d1d 0%, #ef4444 100%); }
        .bg-drogi { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .bg-sport { background: linear-gradient(135deg, #312e81 0%, #6366f1 100%); }
        .bg-neutralny { background: linear-gradient(135deg, #1e293b 0%, #64748b 100%); }
        .zauwazono, .also { font-style: italic; }
        .empty { color: var(--text-muted); }
        [hidden] { display: none !important; }
        @media (max-width: 1100px) { .kat-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 800px) { .front { grid-template-columns: 1fr; } .hero { min-height: 280px; } .hero h2 { font-size: 1.8rem; } header { padding: 0.7rem 1rem 0; } main { padding: 0 1rem; } h1 { font-size: 1.5rem; } }
        @media (max-width: 600px) { .kat-grid { grid-template-columns: 1fr; } }
        footer { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.82rem; border-top: 1px solid var(--rule); margin-top: 4rem; background-color: #ffffff; }
    </style>
</head>
<body>
<!-- ILU_SPRITE_PLACEHOLDER -->
    <header>
        <div class="header-container">
            <h1>Grodzisk<span> lokalnie</span></h1>
            <div class="dzien"><!-- DATE_PLACEHOLDER --></div>
            <div class="updated"><!-- UPDATED_PLACEHOLDER --> · <a href="archiwum.html" style="color:var(--accent);text-decoration:none">Archiwum</a></div>
        </div>
        <!-- NAV_PLACEHOLDER -->
    </header>
    <main>
        <!-- FILTERS_PLACEHOLDER -->
        <!-- TICKER_PLACEHOLDER -->
        <!-- FRONT_PLACEHOLDER -->
        <!-- TERMS_PLACEHOLDER -->
        <!-- DYNAMIC_CARDS_PLACEHOLDER -->
        <p class="empty" id="brak" hidden>Brak aktualnych wpisów.</p>
    </main>
    <footer>
        <p>Informacje zbierane z publicznych stron lokalnych instytucji i mediów oraz opracowywane przez redakcję. Pokazujemy fakty i link do oryginału, pełne treści czytaj u wydawców. <a href="zdjecia.html">Autorzy zdjęć i licencje</a>. Zauważyłeś błąd? Napisz do redakcji.</p>
    </footer>
    <script>
    (function () {
        var place = "", kind = "", rozwiniete = false;
        var feed = document.querySelector(".feed-grid"), sekcja = document.getElementById("feed");
        function match(c) {
            // wybrana miejscowość: tylko wpisy o niej; z wpisów "cała gmina" zostają tylko ostrzeżenia (dotyczą wszystkich)
            if (!place) return true;
            var places = (c.dataset.place || "").split("|");
            return places.indexOf(place) > -1 || (c.dataset.place === "cała gmina" && c.dataset.kind === "ost");
        }
        function apply() {
            var licznik = {}, razem = 0;
            document.querySelectorAll(".front .portal-card, .feed-grid .portal-card:not(.copy)").forEach(function (c) {
                if (match(c)) { licznik[c.dataset.kind] = (licznik[c.dataset.kind] || 0) + 1; razem++; }
            });
            document.querySelectorAll(".front .portal-card, .tick").forEach(function (c) { c.hidden = !match(c); });
            var front = document.querySelector(".front");
            if (front) front.hidden = kind !== "" || !front.querySelector(".portal-card:not([hidden])");
            var tick = document.querySelector(".ticker");
            if (tick) tick.hidden = !tick.querySelector(".tick:not([hidden])");
            var term = document.querySelector(".terminy");
            if (term) {
                var dzis = new Date(); dzis = new Date(dzis.getFullYear(), dzis.getMonth(), dzis.getDate());
                term.querySelectorAll(".td").forEach(function (g) {
                    var p = g.querySelector("time").getAttribute("datetime").split("-");
                    var minal = new Date(+p[0], p[1] - 1, +p[2]) < dzis;    // strona zbudowana wcześniej niż dziś: minione terminy znikają
                    g.querySelectorAll(".termin").forEach(function (c) { c.hidden = minal || !match(c); });
                    g.hidden = !g.querySelector(".termin:not([hidden])");
                });
                term.hidden = kind !== "" || !term.querySelector(".termin:not([hidden])");
            }
            var n = 0, start = sekcja ? +sekcja.dataset.start : 0;
            if (feed) feed.querySelectorAll(".portal-card").forEach(function (c) {
                var ok = match(c) && (!kind || c.dataset.kind === kind) && (!c.classList.contains("copy") || kind !== "");
                if (ok) n++;
                c.hidden = !ok || (!rozwiniete && n > start);
            });
            if (sekcja) {
                var wszystkich = kind ? (licznik[kind] || 0) : razem;
                sekcja.querySelector(".kat-count").textContent = wszystkich;
                sekcja.hidden = n === 0;
                var btn = sekcja.querySelector(".more");
                btn.hidden = n <= start;
                btn.textContent = rozwiniete ? "Pokaż mniej" : "Pokaż więcej (" + (n - start) + ")";
            }
            document.querySelectorAll(".cat-link").forEach(function (link) {
                var k = link.dataset.kind, ile = k === "" ? razem : (licznik[k] || 0);
                link.querySelector(".cat-count").textContent = ile;
                link.classList.toggle("zero", ile === 0);
                link.classList.toggle("active", k === kind);
                link.hidden = ile === 0 && k !== "" && !("stale" in link.dataset) && k !== kind;
            });
        }
        var brak = document.getElementById("brak");
        function pustaStrona() {
            if (!brak) return;
            brak.hidden = !!document.querySelector(".feed-grid .portal-card:not([hidden]), .front:not([hidden]), .terminy:not([hidden])");
            brak.textContent = place ? "Brak wpisów dla wybranej miejscowości." : (kind ? "Brak aktualnych wpisów w tej kategorii." : "Brak aktualnych wpisów.");
        }
        document.querySelectorAll(".more").forEach(function (b) {
            b.addEventListener("click", function () { rozwiniete = !rozwiniete; apply(); });
        });
        document.querySelectorAll(".cat-link").forEach(function (a) {
            a.addEventListener("click", function (ev) {
                ev.preventDefault();
                kind = a.dataset.kind; rozwiniete = false; apply(); pustaStrona();
            });
        });
        var sel = document.getElementById("place");
        if (sel) sel.addEventListener("change", function () { place = sel.value; apply(); pustaStrona(); });
        apply();
        pustaStrona();
        var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        document.querySelectorAll("time[datetime]").forEach(function (t) {
            var p = t.getAttribute("datetime").split("-");
            var diff = Math.round((new Date(+p[0], p[1] - 1, +p[2]) - today) / 864e5);
            var word = { "0": "dzisiaj", "-1": "wczoraj", "1": "jutro" }[diff];
            if (!word) return;
            var g = t.getAttribute("data-t");
            t.textContent = word + (g ? ", godz. " + g : "");
        });
    })();
    </script>
</body>
</html>
