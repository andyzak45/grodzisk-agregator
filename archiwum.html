<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiwum – Grodzisk lokalnie</title>
    <style>
        :root { --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #475569; --accent: #2563eb; --border-radius: 16px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.5; }
        header { background-color: var(--card-bg); border-bottom: 1px solid #e2e8f0; padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.05em; }
        h1 span { color: var(--accent); }
        .updated { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        main { max-width: 1300px; margin: 2rem auto; padding: 0 1.5rem; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .chip, select { font: inherit; font-size: 0.9rem; padding: 0.4rem 0.9rem; border-radius: 99px; border: 1px solid #cbd5e1; background: var(--card-bg); color: var(--text-main); cursor: pointer; }
        .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .magazine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%; }
        .portal-card { background-color: var(--card-bg); border-radius: var(--border-radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease; }
        .portal-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .hero-tile { grid-column: span 2; }
        .hero-tile .img-container { height: 200px; }
        .hero-tile h2 { font-size: 1.6rem; }
        .img-container { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; position: relative; }
        .bg-kultura { background: linear-gradient(135deg, #7c2d12 0%, #f59e0b 100%); }
        .bg-finanse { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); }
        .bg-alert { background: linear-gradient(135deg, #7f1d1d 0%, #ef4444 100%); }
        .bg-drogi { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .bg-edukacja { background: linear-gradient(135deg, #9d174d 0%, #f43f5e 100%); }
        .bg-sport { background: linear-gradient(135deg, #312e81 0%, #6366f1 100%); }
        .bg-neutralny { background: linear-gradient(135deg, #1e293b 0%, #64748b 100%); }
        .ico { width: 34px; height: 34px; color: rgba(255,255,255,0.92); margin-right: 0.6rem; flex-shrink: 0; }
        .hero-tile .ico { width: 56px; height: 56px; }
        .hero-tile .tile-category-text { font-size: 1rem; }
        .opis { color: #334155; font-size: 0.92rem; margin: 0 0 0.75rem 0; }
        .auto { color: #94a3b8; font-size: 0.75rem; }
        .zauwazono, .also { font-style: italic; }
        .tile-category-text { color: #ffffff; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-shadow: 0 2px 4px rgba(0,0,0,0.4); text-transform: uppercase; }
        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .meta-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.75rem; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .badge { background-color: #eff6ff; color: var(--accent); padding: 0.25rem 0.5rem; border-radius: 6px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }
        h2 { margin: 0 0 0.75rem 0; font-size: 1.15rem; font-weight: 800; line-height: 1.35; color: #0f172a; letter-spacing: -0.01em; }
        .when { color: #334155; font-size: 0.9rem; margin: 0 0 1rem 0; font-weight: 600; }
        .read-more { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.85rem; margin-top: auto; display: inline-flex; align-items: center; }
        .empty { color: var(--text-muted); }
        [hidden] { display: none !important; }
        @media (max-width: 968px) { .magazine-grid { grid-template-columns: 1fr; } .hero-tile { grid-column: span 1; } header { padding: 1rem; } }
        footer { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.82rem; border-top: 1px solid #e2e8f0; margin-top: 4rem; background-color: #ffffff; }

        .arch-link { font-size: 0.9rem; font-weight: 700; color: var(--accent); text-decoration: none; }
        .arch-tools { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
        .arch-tools input { font: inherit; padding: 0.5rem 1rem; border-radius: 99px; border: 1px solid #cbd5e1; min-width: 16rem; flex: 1; max-width: 28rem; }
        .arch-month { font-size: 1.2rem; margin: 2rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 2px solid #e2e8f0; }
        .arch-list { list-style: none; margin: 0; padding: 0; }
        .arch-list li { background: var(--card-bg); border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.7rem 1rem; margin-bottom: 0.5rem; }
        .arch-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .arch-list a.t { font-weight: 700; color: var(--text-main); text-decoration: none; }
        .arch-list a.t:hover { color: var(--accent); text-decoration: underline; }
        .arch-list p { margin: 0.25rem 0 0; font-size: 0.92rem; color: var(--text-muted); }
        .arch-count { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
    </style>
</head>
<body>
<header><div class="header-container"><h1>Grodzisk<span> lokalnie</span> – archiwum</h1><a class="arch-link" href="index.html">&larr; Strona główna</a></div></header>
<main><div class="arch-tools"><input id="q" type="search" placeholder="Szukaj w archiwum…" aria-label="Szukaj"><select id="k" aria-label="Rodzaj"><option value="">Wszystkie rodzaje</option><option value="ost">Ostrzeżenia</option></select></div><div class="arch-count" id="cnt"></div><section class="arch-group"><h2 class="arch-month">Wrzesień 2026</h2><ul class="arch-list"><li data-kind="ost" data-s="zagrożenie atakiem z powietrza  zarządzanie kryzysowe cała gmina ostrzeżenia"><a class="t" href="https://zarzadzaniekryzysowe.grodzisk.pl/2026/09/30/zagrozenie-atakiem-z-powietrza/" target="_blank" rel="noopener">Zagrożenie atakiem z powietrza</a><div class="arch-meta"><span>30.09.2026</span><span>Ostrzeżenia</span><span>Cała gmina</span><span>Zarządzanie kryzysowe</span></div></li></ul></section></main>
<footer><p>Archiwum zawiera starsze wpisy zebrane z publicznych stron lokalnych instytucji i mediów. Pełne treści czytaj u wydawców.</p></footer>
<script>
(function () {
  var q = document.getElementById('q'), k = document.getElementById('k'), cnt = document.getElementById('cnt');
  function f() {
    var t = q.value.toLowerCase().trim(), kind = k.value, n = 0;
    document.querySelectorAll('.arch-list li').forEach(function (li) {
      var ok = (!t || li.dataset.s.indexOf(t) > -1) && (!kind || li.dataset.kind === kind);
      li.hidden = !ok; if (ok) n++;
    });
    document.querySelectorAll('.arch-group').forEach(function (g) {
      g.hidden = !g.querySelector('li:not([hidden])');
    });
    cnt.textContent = n + ' wpisów';
  }
  q.addEventListener('input', f); k.addEventListener('change', f); f();
})();
</script>
</body></html>
