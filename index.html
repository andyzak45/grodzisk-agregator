<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grodzisk & Książenice — Portal Informacyjny i Radar AI</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid #cbd5e1;
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 { margin: 0; font-size: 1.4rem; font-weight: 800; }
        h1 span { color: #2563eb; }

        .search-bar {
            padding: 0.55rem 1rem;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            width: 260px;
            font-size: 0.88rem;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* SIATKA AKTUALNOŚCI NA SAMEJ GÓRZE */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.75rem;
            margin-bottom: 3rem;
            width: 100%;
        }

        .news-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .news-card:hover {
            transform: translateY(-4px);
        }

        .svg-container {
            width: 100%;
            height: 140px;
            border-bottom: 1px solid #e2e8f0;
            display: block;
        }

        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .source-tag {
            background-color: #f1f5f9;
            color: #334155;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-weight: 600;
        }

        h2 { margin: 0 0 0.6rem 0; font-size: 1.15rem; font-weight: 700; line-height: 1.4; color: #1e293b; }
        p { color: #475569; font-size: 0.92rem; margin: 0 0 1.5rem 0; text-align: justify; }
        .source-link { color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.88rem; margin-top: auto; }

        /* RADAR PRZENIESIONY NA DÓŁ STRONY */
        .radar-section {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid #cbd5e1;
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .radar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .radar-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .radar-screen {
            width: 100%;
            height: 400px;
            background-color: #0b0f19;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-grid {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 50%;
        }
        .radar-grid::before {
            content: '';
            position: absolute;
            top: 50px; left: 50px; width: 250px; height: 250px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 50%;
        }
        .radar-grid::after {
            content: '';
            position: absolute;
            top: 100px; left: 100px; width: 150px; height: 150px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
        }

        .radar-axis-h {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2) 50%, transparent);
        }
        .radar-axis-v {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(16, 185, 129, 0.2) 50%, transparent);
        }

        .radar-sweeper {
            position: absolute;
            width: 50%;
            height: 50%;
            background: linear-gradient(45deg, rgba(16, 185, 129, 0.3) 0%, transparent 60%);
            transform-origin: bottom right;
            bottom: 50%;
            right: 50%;
            animation: sweep 4s linear infinite;
        }

        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .radar-target {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: blinkTarget 1.5s ease-in-out infinite alternate;
        }

        @keyframes blinkTarget {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); box-shadow: 0 0 8px currentColor; }
        }

        .radar-label {
            position: absolute;
            color: #10b981;
            font-family: monospace;
            font-size: 0.75rem;
            background-color: rgba(11, 15, 25, 0.7);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            pointer-events: none;
        }

        .map-legend {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 5rem;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>Grodzisk&Książenice<span>.bento</span></h1>
            <input type="text" id="searchInput" class="search-bar" placeholder="Filtruj wiadomości...">
        </div>
    </header>

    <main>
        
        <!-- SIATKA AKTUALNOŚCI NA SAMEJ GÓRZE -->
        <div class="news-grid" id="newsGrid">
            
            <!-- KARTA 1 -->
            <div class="news-card">

                    <rect width="400" height="140" fill="url(#grad1)" />
                    <path d="M 50 100 L 150 60 L 250 80 L 350 35" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>

            </div>

            <!-- KARTA 2 -->
            <div class="news-card">
                <svg class="svg-container" viewBox="0 0 400 140" xmlns="http://w3.org">
